name: Em-dash gate

# The brand rule (founder directive 2026-07-24, written down in the knowledgebase repo at
# 06-brand/voice-and-tone.md: "No em dashes. Ever.") bans U+2014 outright across every
# cosyte surface, and names commit messages explicitly. `documentation/conventions.md` in
# the meta-repo has claimed the rule is CI-gated since it was written. This workflow runs
# that rule in CI for ccda, over the tracked files and over the text that is not a file.
#
# READ THIS BEFORE TRUSTING IT TO BLOCK ANYTHING. It runs on every PR and it reports, but
# it is NOT a required status check, so today it does not stop a merge. Verified against
# the API rather than assumed: `cosyte/ccda` is governed by two ORGANIZATION-level rulesets
# (`baseline-branch-protection`, `parser-ci-required-checks`), and the required contexts are
# exactly `ci / verify (22, ubuntu-latest)`, `ci / verify (24, ubuntu-latest)` and
# `ci / actionlint`. This job's context is `Em-dash gate / no-emdash`, which is not among
# them, and `allow_auto_merge` is true with zero required approvals. So a PR carrying a live
# character in its title or in a tracked file CAN auto-merge while this job is red or still
# running.
#
# CLOSING IT IS A GITHUB SETTINGS CHANGE, NOT A FILE CHANGE, and being exact about that is
# the point of this paragraph. There is nothing to edit in any repo. Rulesets live at
# `orgs/cosyte/rulesets` and `repos/cosyte/<repo>/rulesets`; the `cosyte/.github` repo holds
# reusable workflows and community-health files and defines no ruleset anywhere, so "make a
# `cosyte/.github` change" would send the next reader into a submodule with nothing in it to
# change. Two real routes, and rulesets stack additively so either works:
#   * add `Em-dash gate / no-emdash` to the ORG ruleset `parser-ci-required-checks`. That
#     covers every parser it governs in one edit (hl7, x12, ncpdp, dicom, mllp and this
#     repo), and as of 2026-07-27 all of them carry a workflow named `Em-dash gate` with a
#     job named `no-emdash`, so the context resolves everywhere it would be required. It
#     needs `admin:org`, which the management token does not have today.
#   * or add a REPOSITORY-level ruleset on `cosyte/ccda`. That is not hypothetical: it is
#     exactly what `pathways`, `docs` and `website` do (`ci-required-checks`), and `iac`
#     (`baseline-and-ci-required-checks`). It needs no org permission and covers only this
#     repo.
# Either way it is out of scope for a slice that ships files, and it is deliberately not
# attempted here. Until one of them happens, the honest claim is that this gate makes a
# violation VISIBLE on every PR, not that it makes one impossible. hl7, x12, ncpdp, dicom
# and mllp carry the same gap under the same org ruleset. (`fhir` had no ruleset and no
# branch protection at all when this was written; a repository-level one was added
# 2026-07-27, after this commit.) The overstatement was this port's, so this port corrects it.
#
# That hazard is written down in this ecosystem already, and it is worth naming here so the
# next reader does not have to rediscover it: `docs/CLAUDE.md` records that moving a gate
# into its own job "for clarity" silently stops it blocking a merge, because the new job is
# not in the required list. The reasoning below for a separate workflow is about COST, and
# cost is the only thing it settles. It does not buy enforcement, and it never did.
#
# ccda was NOT already clean when this landed, which is unusual for a repo that had
# already run a remediation sweep. PR #52 removed em dashes from source and config on
# 2026-07-24 and missed `src/profiles/merge.ts`, because two functional NUL bytes in that
# file make grep classify first-party TypeScript as binary and skip it. One live character
# therefore survived a pass aimed straight at it. This gate found it on its first run, and
# the slice that added the gate removed it. The script header tells that story in full,
# because it is this repo's own evidence for a limit usually argued in the abstract.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-emdash`, which is this
# repository's own gate script. The jobs below delegate the plumbing (checkout, pnpm,
# Node) to the shared gate workflow, and that workflow carries no pattern, no allow-list
# and no file selection of its own: it prepares the tree, runs the command, and lets the
# command's exit status decide the job. So the rule and every measurement above stay in
# this repository, and only the harness is shared.
#
# TWO CONTEXTS, NOT ONE, AND THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A branch ruleset binds to those
# exact strings: renaming the job detaches the requirement with no error anywhere, and a
# required context nothing emits blocks every pull request. Do not rename it.
#
#   `no-emdash / tracked-files` is the half that is safe to require and the one that blocks
#   a merge. `no-emdash / messages` runs, reds its own context, and is deliberately NOT
#   required: Dependabot composes a pull request body out of upstream release notes, em
#   dashes included, and a gate that fails on someone else's clock becomes a tax. The
#   detection is unchanged either way; only what blocks is narrowed.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml:
#
#   The shared ci pipeline is not an option. ccda's `ci` job calls
#   cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no
#   arbitrary repo script. Adding the gate there would also flip crew, config, iac, and
#   assets red on their next run: all four violate the ban wholesale today, and remediating
#   them is separate, founder-gated work. A shared pipeline is the wrong place to land a
#   rule several of its callers cannot yet satisfy. The correct variant of the script also
#   differs per repo (repos tracking undeclared binary assets take website's NUL-partition
#   one), so the gate stays per-repo until every caller carries a script.
#
#   Within ccda, the deciding factor is the trigger. The PR-text half below needs the
#   `edited` activity type, which is not a default: without it, a title or body edited
#   after the last push is never re-checked. What makes that matter is exactly what a
#   squash merge lands here, which is a repo setting and was READ rather than assumed:
#   `allow_squash_merge: true` (and only squash), `squash_merge_commit_title:
#   COMMIT_OR_PR_TITLE`, `squash_merge_commit_message: COMMIT_MESSAGES`. So the subject on
#   main comes from the PR title (or from the lone commit's subject), and the body is the
#   branch commit messages concatenated. THE PR BODY DOES NOT LAND. It is scanned anyway,
#   deliberately: it is a cosyte surface in its own right and it costs nothing to cover.
#   ncpdp's copy of this comment said the title and body both land; that is wrong, dicom
#   corrected it after reading the same settings, and this port takes the correction rather
#   than re-inheriting the error. But ci.yml's triggers drive the shared pipeline over the
#   Node 22 + 24 matrix (typecheck, lint, format, PHI scan, test, coverage, build, attw,
#   dual ESM/CJS smoke). Re-running all of that every time someone fixes a typo in a PR
#   description is a large cost for no extra safety. Same call hl7, fhir, pathways,
#   website, x12, ncpdp and dicom made, for the same reason.
#
#   Both halves live here rather than splitting the file scan back into ci.yml (which is
#   how website ended up): the file scan is a checkout and one grep, so it costs nothing to
#   re-run on `edited`, and one file is one thing to read. knowledgebase runs
#   them the same way (knowledgebase#12).
#
# This gate covers new text only. It does not rewrite history, and history here is not
# clean: 113 em dashes sit in commit messages already on main, including PR #52's own
# subject line. Rewriting published commit messages is not on the table. So the honest
# scope is that new text carrying a live character is REPORTED on every PR, by a job that
# is not yet required and therefore does not yet block the merge (see the top of this
# file). Do not read the scope note as a guarantee that nothing new lands with one.
#
# Run the file half locally with `pnpm check:no-emdash`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Pinned to the 40 character commit, not to the tag beside it: a tag can be moved
    # or deleted by anyone who gains write access to the workflow's repository, so a
    # tag is not an immutable reference and is not a pin. The trailing comment is the
    # published reference that commit was released as, so the release note stays
    # findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-emdash.yml@84ecccd771cbc9c1ece003a3f8ff61415360395b # workflows-2026-09-18-84ecccd771cb
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
