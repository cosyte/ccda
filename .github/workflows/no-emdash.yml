name: Em-dash gate

# The brand rule (founder directive 2026-07-24, written down in the knowledgebase repo at
# 06-brand/voice-and-tone.md: "No em dashes. Ever.") bans U+2014 outright across every
# cosyte surface, and names commit messages explicitly. `documentation/conventions.md` in
# the meta-repo has claimed the rule is CI-gated since it was written. This workflow is
# the CI half of that rule for ccda: the tracked files, and the text that is not a file.
#
# ccda was NOT already clean when this landed, which is unusual for a repo that had
# already run a remediation sweep. PR #52 removed em dashes from source and config on
# 2026-07-24 and missed `src/profiles/merge.ts`, because two functional NUL bytes in that
# file make grep classify first-party TypeScript as binary and skip it. One live character
# therefore survived a pass aimed straight at it. This gate found it on its first run, and
# the slice that added the gate removed it. The script header tells that story in full,
# because it is this repo's own evidence for a limit usually argued in the abstract.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml:
#
#   The reusable pipeline is not an option. ccda's `ci` job calls
#   cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no
#   arbitrary repo script. Adding the gate there would also flip crew, config, iac, and
#   assets red on their next run: all four violate the ban wholesale today, and remediating
#   them is separate, founder-gated work. A shared pipeline is the wrong place to land a
#   rule several of its callers cannot yet satisfy. The correct variant of the script also
#   differs per repo (repos tracking undeclared binary assets take website's NUL-partition
#   one), so the gate stays per-repo until every caller carries a script.
#
#   Within ccda, the deciding factor is the trigger. The PR-text half below needs the
#   `edited` activity type, which is not a default: without it, a title or body edited
#   after the last push is never re-checked. What makes that matter is exactly what a
#   squash merge lands here, which is a repo setting and was READ rather than assumed:
#   `allow_squash_merge: true` (and only squash), `squash_merge_commit_title:
#   COMMIT_OR_PR_TITLE`, `squash_merge_commit_message: COMMIT_MESSAGES`. So the subject on
#   main comes from the PR title (or from the lone commit's subject), and the body is the
#   branch commit messages concatenated. THE PR BODY DOES NOT LAND. It is scanned anyway,
#   deliberately: it is a cosyte surface in its own right and it costs nothing to cover.
#   ncpdp's copy of this comment said the title and body both land; that is wrong, dicom
#   corrected it after reading the same settings, and this port takes the correction rather
#   than re-inheriting the error. But ci.yml's triggers drive the shared pipeline over the
#   Node 22 + 24 matrix (typecheck, lint, format, PHI scan, test, coverage, build, attw,
#   dual ESM/CJS smoke). Re-running all of that every time someone fixes a typo in a PR
#   description is a large cost for no extra safety. Same call hl7, fhir, pathways,
#   website, x12, ncpdp and dicom made, for the same reason.
#
#   Both halves live here rather than splitting the file scan back into ci.yml (which is
#   how website ended up): the file scan is a checkout and one grep, so it costs nothing to
#   re-run on `edited`, and one file is one thing to read. They are two steps of one job
#   because the second is meaningless if the first could not run at all. knowledgebase runs
#   them the same way (knowledgebase#12).
#
# This gate covers new text only. It does not rewrite history, and history here is not
# clean: 113 em dashes sit in commit messages already on main, including PR #52's own
# subject line. Rewriting published commit messages is not on the table, so the honest
# scope is that nothing new lands with one.
#
# Run the file half locally with `pnpm check:no-emdash`, which is also on
# `scripts/verify.sh ccda`'s ladder in the meta-repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-emdash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the commit-message step below reads the PR's commit range, and
          # the default shallow clone does not contain the base commit.
          fetch-depth: 0

      - name: Check tracked files
        run: bash scripts/check-no-emdash.sh

      # The rule names commit messages explicitly, and a squash merge composes its message
      # from the PR title, the PR body, and the branch commits, so all three are checked.
      # Pull requests only: on a push to main the message is already written, and this gate
      # exists to stop it landing.
      - name: Check PR title, body, and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Collect first, scan second, and set the shell options here rather than trust
          # the runner's default: piping the collection straight into the scanner would
          # hide a failed `git log` (a rewritten base commit, or a future edit that drops
          # fetch-depth) behind a clean title and body, and the gate would print OK over
          # commits it never read. The title and body arrive through env and are never
          # interpolated into the script, so a PR description cannot inject shell.
          set -euo pipefail
          {
            printf '%s\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
            git log --format=%B "$BASE_SHA..$HEAD_SHA"
          } > "$RUNNER_TEMP/pr-messages.txt"
          bash scripts/check-no-emdash.sh --stdin "the PR title, body, or commit messages" \
            < "$RUNNER_TEMP/pr-messages.txt"
