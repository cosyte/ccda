name: Em-dash gate

# The brand rule (founder directive 2026-07-24, written down in the knowledgebase repo at
# 06-brand/voice-and-tone.md: "No em or en dashes. Ever.") bans the em dash (U+2014) and the
# en dash (U+2013) outright across every Cosyte surface, and names commit messages
# explicitly. This workflow runs that rule in CI for ccda, over the tracked files and over
# the text that is not a file.
#
# WHAT BLOCKS, read from the API rather than assumed. On 2026-11-08 `no-emdash / tracked-files`
# was a required context on `main` (the repository ruleset `emdash-required-check`, beside the
# org rulesets `baseline-branch-protection` and `parser-ci-required-checks`; derive the current
# set with `gh api repos/cosyte/ccda/rules/branches/main`), so a tracked file carrying a banned
# form could not merge. `no-emdash / messages` runs, reds its own context, and
# is deliberately NOT required: Dependabot composes a pull request body out of upstream
# release notes, em dashes included, and a gate that fails on someone else's clock becomes a
# tax. The detection is the same either way; only what blocks is narrowed.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-emdash`, which is this
# repository's own gate script, `scripts/check-no-emdash.sh`. The jobs below delegate the
# plumbing (checkout, pnpm, Node) to the shared gate workflow, which carries no pattern, no
# allow-list and no file selection of its own: it prepares the tree, runs the command, and
# lets the command's exit status decide the job. The script header records why the scan is
# not a grep: two functional NUL bytes in `src/profiles/merge.ts` make grep classify that
# first-party TypeScript as binary and skip it, which is how one live character survived the
# sweep in #52.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A ruleset binds to those exact
# strings: renaming the job detaches the requirement with no error anywhere, and a required
# context nothing emits blocks every pull request. Do not rename it.
#
# WHY `edited`, AND WHY A SEPARATE WORKFLOW. On 2026-11-08 this repository squash-merged with
# `squash_merge_commit_title: PR_TITLE` and `squash_merge_commit_message: PR_BODY` (derive the
# current values with `gh api repos/cosyte/ccda`), so the pull request title and body ARE the
# commit that lands on `main`. A title or body edited
# after the last push therefore has to be re-checked, and `edited` is not a default
# activity type. ci.yml's triggers drive the shared pipeline over the Node 22, 24, and 26
# matrix; re-running all of that every time someone fixes a typo in a pull request
# description is a large cost for no extra safety, so the gate keeps its own triggers here.
#
# This gate covers new text only. It does not rewrite history: 113 em dashes sit in commit
# messages already on `main`, including #52's own subject line, and rewriting published
# commit messages is not on the table.
#
# Run the file half locally with `pnpm check:no-emdash`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Named by its published reference, which ci.yml and every other caller here share. Each
    # reference is an immutable release in cosyte/.github, so its tag cannot be moved or
    # deleted and it names one commit for good.
    uses: cosyte/.github/.github/workflows/gate-no-emdash.yml@workflows-2026-11-07-498c7c13c886
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
