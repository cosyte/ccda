name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers (`CCDA-P7`), phase and wave language, ADR numbers, meta-repo
# paths, prose roadmap citations and process commentary belong in the changeset,
# CHANGELOG.md, the commit, the PR and the roadmap, never in README.md, docs-content/, the
# npm description, a JSDoc block a consumer's editor renders, or a warning message a
# consumer reads in their logs. `cosyte-internal-refs`, the shared gate from
# `@cosyte/script-utils` (ST34), enforces it, configured by `scripts/internal-refs.json`.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(CCDA-P8)` into a README; a job that reds does not.
#
# READ THIS BEFORE TRUSTING IT TO BLOCK ANYTHING. This job runs on every PR and it REPORTS;
# on 2026-11-08 it was not a required status check, so it did not stop a merge. The required
# contexts on `main` were `ci / verify (22, ubuntu-latest)`, `ci / verify (24, ubuntu-latest)`,
# `ci / actionlint` and `no-emdash / tracked-files` (derive the current set with
# `gh api repos/cosyte/ccda/rules/branches/main`); this job's context,
# `no-internal-refs / public-surface`, was not among them. Closing that is a GitHub settings
# change (a ruleset entry), not a file change. Until then the honest claim is that a
# violation is VISIBLE on every PR, not that it is impossible.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-internal-refs`, which runs
# `cosyte-internal-refs` from the `@cosyte/script-utils` devDependency. The job below
# delegates the plumbing (checkout, pnpm, Node, and the install the gate needs) to the shared
# gate workflow, which carries no pattern, no allow-list and no file selection of its own: it
# prepares the tree, runs the command, and lets the command's exit status decide the job. The
# rules are the shared ones; `scripts/internal-refs.json` holds this package's prefixes,
# designations, surface, the passes over `src/` doc comments and string literals, and three
# extra rules that keep the shared gate reading at least what this repository's former
# checker read. The shared gate reads the two functional NUL bytes in `src/profiles/merge.ts`
# as spaces, so that file's doc comments are scanned.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below publishes
# `no-internal-refs / public-surface`, which is the context a ruleset must require.
# Renaming the job detaches that requirement with no error anywhere, and a required
# context nothing emits blocks every pull request.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. The shared ci pipeline runs a fixed
# ladder and no arbitrary repo script, and this job is a checkout, an install and one scan,
# while ci.yml drives the full Node 22, 24, and 26 matrix; keeping it apart keeps it cheap.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# The em-dash gate scans all three because the brand rule names commit messages explicitly.
# THIS rule says the opposite: identifiers BELONG in the commit, the PR and the changeset,
# so a PR-text half here would red on correct work. That is also why there is no `edited`
# trigger: nothing here reads PR text, so retitling a PR cannot change the result.
#
# It does not check `CHANGELOG.md` either, and that one is SETTLED rather than deferred:
# the founder exempted CHANGELOG.md org-wide on 2026-07-29, because an item reference in a
# changelog reads as provenance rather than as the company talking to itself. The exemption
# is that file and nothing else.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Named by its published reference, which ci.yml and every other caller here share. Each
    # reference is an immutable release in cosyte/.github, so its tag cannot be moved or
    # deleted and it names one commit for good.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
