name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:03 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "3 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the shared Node matrix, 22, 24, and 26. Repo-specific extra
  # jobs (e.g. an examples smoke, a starter-kit build) are added on top of this caller, never
  # instead of it. ccda ships a PHI scanner, so the shared pipeline's optional PHI-scan step is
  # switched on.
  #
  # Every caller of cosyte/.github in this directory names the same published reference, and they
  # move together. A reference is an immutable release there, so it names one commit for good;
  # nothing reaches this pipeline until one of these `uses:` lines is edited here.
  #
  # The performance standard's two jobs run beside `verify`, never after it, so a pull request waits
  # for the slowest job rather than their sum:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gate in test/perf/scaling-gate.perf.ts and its
  #   self-check, never under coverage;
  # - `bench-compare` (pull requests only): bench/ccda.bench.mjs timed on the base build and the head
  #   build, interleaved on one runner. Advisory: it never fails, so never require it.
  # A skipped job satisfies a required check, so require `scaling-gate` only while its input below
  # stays on. The full reading, the budgets and the profile are in bench-reading.yml.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@0be6757a773885cbd5165dbfa0f93772d907b3e8 # workflows-2026-11-10-0be6757a7738
    with:
      run-phi-scan: true
      run-scaling-gate: true
      run-bench-compare: true

  # The conformance harness, added ON TOP of the caller above and never instead of it.
  #
  # WHY IT IS NOT PART OF THE SHARED LADDER. `pnpm conformance` reaches the network by design:
  # it fetches the normative C-CDA R2.1 Schematron, its vocabulary file, the CDA R2 XML schema
  # and a public sample corpus from the pinned immutable references in
  # `scripts/conformance/artifacts.json`, and an artifact it cannot obtain FAILS the run rather
  # than passing it. That is a criterion, not a nicety, and it is why the check is a separate
  # command from `pnpm test`: folding it into the ordinary suite would make that suite red on
  # any machine behind an egress lockdown, and the pressure to soften that red is exactly how
  # a fail-safe like this one gets quietly reversed.
  #
  # WHAT IT BLOCKS, said plainly rather than assumed. This job's check context is the bare job
  # name, `conformance`, and it is meant to gate a merge on `main`. Requiring it is a GitHub
  # settings change, not a file change, so read the current set rather than trusting this
  # comment: `gh api repos/cosyte/ccda/rules/branches/main`. Until `conformance` is in that set,
  # a red here is visible on every pull request and does not by itself stop a merge.
  #
  # WHY IT CAN BE REQUIRED. On a warm cache the run asks the network for nothing: every
  # artifact is read from `.conformance-artifacts/` and re-hashed against its pin, so an
  # upstream outage cannot red it. A pull request restores the cache `main` saved, and the
  # nightly run keeps that entry from going unused long enough to be evicted. The network is
  # reached only on a miss: the first run after a pin moves, or after an eviction.
  #
  # WHEN AN UPSTREAM ARTIFACT IS UNREACHABLE. The run fails with
  # `CONFORMANCE_ARTIFACT_UNREACHABLE` and names the URL it could not fetch. Then:
  #   1. Read the cache step's log. A miss means the cache did not cover the run; a hit with a
  #      fetch anyway means a cached file failed its digest and was fetched again.
  #   2. Check that the host in the URL is up (raw.githubusercontent.com or
  #      codeload.github.com, both GitHub), and re-run the failed job once it is. A re-run
  #      fetches only what the cache lacks.
  #   3. If the pull request moved a pin, the new artifact has to come from upstream once;
  #      there is no other source. Wait for the host rather than moving the pin back.
  #   4. Never add `continue-on-error`, `|| true` or a skip to get past it, and never take the
  #      context out of the ruleset for an outage: an artifact nobody could fetch is an
  #      artifact nothing was validated against.
  # `CONFORMANCE_ARTIFACT_DIGEST_MISMATCH` is a different fault: the host served bytes other
  # than the pinned commit's, and a re-run will not fix it. Read the diff between the two
  # commits before moving a pin in `scripts/conformance/artifacts.json`.
  #
  # ONE NODE VERSION, NOT THE MATRIX. The shared caller already runs the type checker, the
  # linter and the suite on Node 22, 24, and 26. What this job measures is a property of the
  # DOCUMENTS the builder emits, which is the same on each, so another run would buy a
  # duplicate answer and another 65 MB download.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The vocabulary file alone is about 65 MB. The cache saves the time to fetch it and keeps
      # the run off the network, and it can never stand in for the check: the key is the pin
      # file's own hash, and every cached file is re-hashed against its pin before a single
      # byte of it is validated against. A cached file that fails that check, the corpus
      # archive included, is fetched again, so a poisoned or half-written entry is a miss
      # rather than a way past the digest check or a red that outlives it.
      #
      # `restore-keys` covers a change to the pin file: the newest earlier entry is restored,
      # the artifacts whose pins did not move are read from it, and only a moved pin is
      # fetched. That is safe for the same reason as above: a stale file fails its own digest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .conformance-artifacts
          key: conformance-artifacts-${{ hashFiles('scripts/conformance/artifacts.json') }}
          restore-keys: conformance-artifacts-

      - run: pnpm install --frozen-lockfile

      # No `|| true` and no `continue-on-error`: a check that cannot fail is documentation.
      # The command writes `documentation/conformance-report.md` and fails if the committed
      # bytes differ from what this run produced, so a behaviour that moved without its
      # published statement moving with it reds here.
      - run: pnpm conformance

  # The runnable examples under examples/, checked the way a consumer meets them: each imports
  # `@cosyte/ccda` by name, which resolves through package.json `exports` to the BUILT dist/, so
  # the build runs first. Each example asserts its own output, so `pnpm examples` goes red when one
  # drifts from the package. The PHI scan in the shared caller above already walks examples/.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:examples
      - run: pnpm lint:examples
      - run: pnpm examples

  # The house checks from @cosyte/script-utils: README, CLAUDE.md card, and catalog. The job also
  # runs `pnpm check:process`, which fails when a verb script stops delegating to `cosyte-process`
  # exactly, when `cosyte-process.config.json` is invalid, or when the direct `vitest` pin drifts
  # from the version @cosyte/process runs.
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:catalog
      - run: pnpm check:process
